<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>🍽 قائمة مطعم أبو </title>
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; padding: 20px; }
    h1 { color: #333; }
    .error { color: red; }
    .menu-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
    .menu-item img { max-width: 150px; border-radius: 8px; }
    .menu-item h2 { margin: 0; }
    .price { font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h1>🍽 قائمة مطعم أبو هيثم</h1>
  <div id="error" class="error"></div>
  <div id="menu"></div>

  <script>
    async function fetchMenu() {
      const errorDiv = document.getElementById('error');
      const menuDiv = document.getElementById('menu');
      errorDiv.textContent = '';
      menuDiv.innerHTML = '';

      try {
        const response = await fetch('/api/menu');  // يستدعي API في Vercel
        if (!response.ok) {
          throw new Error(`خطأ في تحميل البيانات: ${response.status}`);
        }
        const data = await response.json();

        if (data.length === 0) {
          menuDiv.textContent = 'لا توجد أطباق حالياً.';
          return;
        }

        data.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'menu-item';

          itemDiv.innerHTML = `
            <h2>${item.name}</h2>
            <img src="${item.image}" alt="${item.name}" />
            <p>${item.description}</p>
            <p class="price">${item.price} ريال</p>
          `;

          menuDiv.appendChild(itemDiv);
        });

      } catch (error) {
        errorDiv.textContent = error.message;
      }
    }

    fetchMenu();
  </script>
</body>
</html>
