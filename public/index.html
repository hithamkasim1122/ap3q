<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🍽 قائمة مطعم أبو هيثم</title>
<style>
  body { font-family: Arial, sans-serif; direction: rtl; }
  .menu-item { border-bottom: 1px solid #ccc; padding: 10px; }
  .menu-item img { max-width: 150px; }
</style>
</head>
<body>
<h1>🍽 قائمة مطعم أبو هيثم</h1>
<div id="menu"></div>

<script>
async function fetchMenu() {
  try {
    const res = await fetch('/api/menu');
    if (!res.ok) throw new Error('خطأ في تحميل البيانات: ' + res.status);
    const menu = await res.json();
    const menuDiv = document.getElementById('menu');

    if (menu.error) {
      menuDiv.textContent = menu.error;
      return;
    }

    if (menu.length === 0) {
      menuDiv.textContent = 'لا توجد بيانات لعرضها.';
      return;
    }

    menuDiv.innerHTML = menu.map(item => `
      <div class="menu-item">
        <h3>${item.name} - ${item.price} د.ك</h3>
        <img src="${item.image}" alt="${item.name}" />
        <p>${item.description}</p>
      </div>
    `).join('');
  } catch (error) {
    document.getElementById('menu').textContent = 'حدث خطأ عند تحميل البيانات.';
    console.error(error);
  }
}

fetchMenu();
</script>
</body>
</html>
