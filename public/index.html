<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>🍽 قائمة مطعم أبو هيثم</title>
<style>
  body { font-family: Arial, sans-serif; direction: rtl; padding: 20px; background: #f7f7f7; }
  h1 { text-align: center; color: #333; }
  #error { color: red; text-align: center; margin: 20px 0; }
  ul { list-style: none; padding: 0; max-width: 600px; margin: 0 auto; }
  li { background: white; margin: 10px 0; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .price { color: green; font-weight: bold; }
</style>
</head>
<body>

<h1>🍽 قائمة مطعم أبو هيثم</h1>
<div id="error"></div>
<ul id="menu-list"></ul>

<script>
async function fetchMenu() {
  const errorDiv = document.getElementById('error');
  const menuList = document.getElementById('menu-list');

  errorDiv.textContent = '';
  menuList.innerHTML = '';

  try {
    const res = await fetch('/api/menu');
    if (!res.ok) throw new Error('خطأ في استرجاع البيانات: ' + res.status);

    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'خطأ غير معروف من الخادم');

    if (data.data.length === 0) {
      menuList.innerHTML = '<li>لا توجد أصناف متاحة حالياً.</li>';
      return;
    }

    data.data.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${item.name}</strong><br/>
                      السعر: <span class="price">${item.price} د.ك</span><br/>
                      ${item.description || ''}`;
      menuList.appendChild(li);
    });

  } catch (err) {
    errorDiv.textContent = err.message;
  }
}

window.onload = fetchMenu;
</script>

</body>
</html>
